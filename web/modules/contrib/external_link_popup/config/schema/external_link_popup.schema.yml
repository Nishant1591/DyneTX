external_link_popup.settings:
  type: config_object
  label: 'External Link Pop-ups Settings'
  mapping:
    whitelist:
      type: string
      label: Whitelist
    show_admin:
      type: boolean
      label: 'Show on administration pages'
    width:
      type: mapping
      label: 'Default width'
      mapping:
        value:
          type: integer
        units:
          type: string

external_link_popup.external_link_popup.*:
  type: config_entity
  label: 'External Link Pop-up'
  mapping:
    name:
      type: label
      label: 'Name'
    id:
      type: string
      label: 'Machine name'
    weight:
      type: integer
      label: 'Weight'
    status:
      type: boolean
      label: 'Status'
    close:
      type: boolean
      label: 'Show close icon'
    title:
      type: label
      label: Title
    body:
      type: text_format
      label: Body
    labelyes:
      type: label
      label: 'Yes button'
    labelno:
      type: label
      label: 'No button'
    domains:
      type: string
      label: 'Domains'
    new_tab:
      type: boolean
      label: 'Open in new tab'
