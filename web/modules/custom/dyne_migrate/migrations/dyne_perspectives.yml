id: dyne_perspectives
label: 'Dyne perspectives + patient stories'
migration_group: dyne
source:
  plugin: csv
  path: 'modules/custom/dyne_migrate/data/perspectives.csv'
  header_offset: 0
  ids:
    - Slug
  fields:
    - name: Slug
      label: 'Slug'
    - name: Title
      label: 'Title'
    - name: Disease
      label: 'Disease'
    - name: WP URL
      label: 'WP URL'
process:
  title: Title
  field_disease: Disease
  path/alias:
    plugin: concat
    delimiter: ''
    source:
      - constants/prefix
      - Slug
    constants:
      prefix: '/perspectives/'
  type:
    plugin: default_value
    default_value: perspective
destination:
  plugin: 'entity:node'
migration_dependencies: {}
