id: dyne_pages
label: 'Dyne pages (WP page-sitemap)'
migration_group: dyne
source:
  plugin: csv
  path: 'modules/custom/dyne_migrate/data/pages.csv'
  header_offset: 0
  ids:
    - Slug
  fields:
    - name: Slug
      label: 'Slug'
    - name: Title
      label: 'Title'
    - name: WP URL
      label: 'WP URL'
    - name: Drupal path
      label: 'Drupal path'
process:
  title: Title
  path/alias: Drupal path
  body/value: Title
  body/format:
    plugin: default_value
    default_value: full_html
  type:
    plugin: default_value
    default_value: page
destination:
  plugin: 'entity:node'
migration_dependencies: {}
