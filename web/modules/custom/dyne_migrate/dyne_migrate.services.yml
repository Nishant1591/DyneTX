services:
  dyne_migrate.legacy_video_destination:
    class: Drupal\dyne_migrate\EventSubscriber\LegacyVideoDestinationSubscriber
    arguments: ['@file_url_generator']
    tags:
      - { name: event_subscriber }
  dyne_migrate.legacy_numeric_redirect:
    class: Drupal\dyne_migrate\EventSubscriber\LegacyNumericRedirectSubscriber
    arguments: ['@state', '@entity_type.manager', '@path_alias.manager']
    tags:
      - { name: event_subscriber }
