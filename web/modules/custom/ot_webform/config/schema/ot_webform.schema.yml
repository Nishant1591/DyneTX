ot_webform.settings:
  type: config_object
  label: 'OneTrust WebForm settings'
  mapping:
    enabled:
      type: boolean
      label: 'Enable form loading'
    environment:
      type: string
      label: 'Environment'
    prod_id:
      type: string
      label: 'Contact production data ID'
    staging_id:
      type: string
      label: 'Contact test data ID'
    collection_point_id:
      type: string
      label: 'Contact collection point ID'
    dm1_prod_id:
      type: string
      label: 'DM1 production data ID'
    dm1_staging_id:
      type: string
      label: 'DM1 test data ID'
    dm1_collection_point_id:
      type: string
      label: 'DM1 collection point ID'
    source_platform:
      type: uri
      label: 'Source platform'
    data_source_prod:
      type: string
      label: 'Production data source'
    data_source_stage:
      type: string
      label: 'Test data source'
    gtm_event:
      type: string
      label: 'Provider success analytics event'
    thank_you_text:
      type: label
      label: 'Success message'
    cookiebot_enabled:
      type: boolean
      label: 'Load Cookiebot consent banner'
    cookiebot_id:
      type: string
      label: 'Cookiebot domain group ID'
block.settings.ot_webform_embed:
  type: block_settings
  label: 'OneTrust form block'
  mapping:
    profile:
      type: string
      label: 'Form profile'
