dyne_content_sync.settings:
  type: config_object
  label: 'Dyne feed settings'
  mapping:
    greenhouse_enabled:
      type: boolean
      label: 'Enable Greenhouse cron synchronization'
    greenhouse_board:
      type: string
      label: 'Public Greenhouse board identifier'
    gcs_enabled:
      type: boolean
      label: 'Enable GCS cron synchronization'
    gcs_client_id:
      type: string
      label: 'GCS client identifier; override through settings.php, never export credentials'
    interval:
      type: integer
      label: 'Seconds between successful queue refreshes'
