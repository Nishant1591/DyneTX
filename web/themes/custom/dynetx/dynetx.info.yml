name: dynetx
type: theme
description: 'Dyne Therapeutics as-is migration theme. Pixel-match of WP dynetxdev2020 (MDB-based) on Bootstrap5 + Drupal 11.'
package: Custom
base theme: bootstrap5
core_version_requirement: ^10 || ^11
libraries:
  - dynetx/global
libraries-override:
  bootstrap5/global-styling:
    css:
      theme:
        # Match the original grid, resets and component presentation. The
        # existing Bootstrap 5 JavaScript still controls Drupal interactions.
        css/style.css: css/source-base.css
regions:
  alert_banner: 'Alert banner (Duchenne Awareness Day bar)'
  header: Header
  primary_menu: 'Primary menu'
  mobile_drawer: 'Mobile drawer'
  breadcrumb: Breadcrumb
  highlighted: Highlighted
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  stay_in_touch: 'Stay in Touch (footer top)'
  footer: Footer
  modals: Modals
